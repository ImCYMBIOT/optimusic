# Builds the Linux packages (.deb and AppImage) and attaches them to a GitHub release.
# Runs when a release is published, or by hand for an existing tag (Actions → Linux build → Run).
name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the Linux builds to (e.g. v0.2.1)
        required: true

permissions:
  contents: write

jobs:
  linux:
    # Oldest supported Ubuntu with WebKitGTK 4.1, so the AppImage runs on as many distros as possible
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      # A release builds its own tag; a manual run builds the branch it was started from
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev patchelf build-essential pkg-config file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,appimage

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage
