# Builds Optimusic for Windows, Linux and macOS.
#
# Release: write .github/release-notes.md, bump the version, then push a tag:
#   git tag v0.3.0 && git push origin v0.3.0
# That creates a draft release, attaches every platform's installers, then publishes it.
#
# Test build: Actions → Release → Run workflow. Builds everything and keeps the installers
# as workflow artifacts; nothing is released.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Optimusic $TAG" -F draft=true \
            -f body="$(cat .github/release-notes.md)" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Run for test builds too, when create-release is skipped
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis,msi
          # Oldest Ubuntu with WebKitGTK 4.1, so the AppImage runs on as many distros as possible
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
          # One "universal" app for Apple silicon and Intel Macs
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev libssl-dev patchelf build-essential pkg-config file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs update packages once the updater is set up; unused until then
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.id }}

      - name: Keep installers (test build)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: optimusic-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.create-release.outputs.id }}" -F draft=false -f make_latest=true
