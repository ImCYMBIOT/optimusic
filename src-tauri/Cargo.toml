[package]
name = "optimusic"
version = "0.4.4"
description = "Optimusic: an unofficial, lightweight YouTube Music desktop client built on Tauri"
edition = "2021"
license = "MIT"
repository = "https://github.com/ImCYMBIOT/optimusic"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
# OS media integration: MPRIS on Linux, SMTC on Windows, Now Playing on macOS.
# This is what makes your keyboard's media keys and the GNOME media widget work.
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
serde = { version = "1", features = ["derive"] }
url = "2"
discord-rich-presence = "1.1"
tauri-plugin-updater = "2"
serde_json = "1"
# Album art and synced lyrics. Same TLS setup as the updater (rustls + ring), so there's only
# one crypto library in the app
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Direct WebView2 access for the low-memory mode while hidden (versions match wry's).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.100"
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Small, fast release binary
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
